<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />

  <!-- Background Cyber Grid Pattern -->
  <g stroke="#1E293B" stroke-width="0.8" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="120" y1="0" x2="120" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="360" y1="0" x2="360" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="720" y1="0" x2="720" y2="480" />
    <line x1="840" y1="0" x2="840" y2="480" />
    <line x1="960" y1="0" x2="960" y2="480" />
    <line x1="1080" y1="0" x2="1080" y2="480" />
  </g>

  <!-- Glowing Radial Backdrops -->
  <circle cx="200" cy="140" r="180" fill="url(#glowGrad)" filter="url(#softGlow)" />
  <circle cx="1020" cy="300" r="220" fill="url(#glowGrad)" filter="url(#softGlow)" />

  <!-- Codegeist Top Ribbon -->
  <g transform="translate(60, 42)">
    <rect width="360" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
    <circle cx="20" cy="15" r="5" fill="#10B981" />
    <text x="34" y="20" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">
      CODEGEIST 2026 • ATLASSIAN FORGE NATIVE
    </text>
  </g>

  <!-- Live Status Pill (Top Right) -->
  <g transform="translate(940, 42)">
    <rect width="200" height="30" rx="15" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.2" />
    <circle cx="22" cy="15" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="20" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="0.8">
      STATUS: LIVE IN JIRA CLOUD
    </text>
  </g>

  <!-- Main Headline Title -->
  <text x="60" y="145" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
    ChronosMCP
  </text>
  <text x="390" y="145" fill="#06B6D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5">
    (VeriGraph AI)
  </text>

  <!-- Subtitle with Gradient Accent -->
  <text x="60" y="195" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.3">
    Build with Context. Ship with Confidence.
  </text>

  <!-- Description paragraph -->
  <text x="60" y="235" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" line-height="1.5">
    Autonomous Causal Blast-Radius Simulator, Cross-Silo Policy Gatekeeper, and Bi-Directional Atlassian MCP Bridge.
  </text>
  <text x="60" y="258" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
    Unifies Teamwork Graph telemetry, Rovo AI remediation, and SHA-256 release attestation into one control plane.
  </text>

  <!-- 5 Architecturally Distinct Badges across bottom -->
  <g transform="translate(60, 310)">

    <!-- Badge 1: Atlassian Forge Native -->
    <g transform="translate(0, 0)">
      <rect width="205" height="120" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <circle cx="34" cy="34" r="16" fill="#1E1B4B" />
      <text x="28" y="40" font-size="16">⚡</text>
      <text x="58" y="38" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">Atlassian Forge</text>
      <text x="18" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Custom UI &amp; Serverless</text>
      <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Node 22 • @forge/kvs</text>
      <rect x="18" y="98" width="75" height="14" rx="3" fill="#312E81" />
      <text x="55" y="108" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" text-anchor="middle">MAIN TRACK</text>
    </g>

    <!-- Badge 2: Rovo Autonomous Agent -->
    <g transform="translate(218, 0)">
      <rect width="205" height="120" rx="12" fill="url(#cardGrad)" stroke="#4338CA" stroke-width="1.2" />
      <circle cx="34" cy="34" r="16" fill="#312E81" />
      <text x="27" y="40" font-size="16">🤖</text>
      <text x="58" y="38" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">Rovo Agent</text>
      <text x="18" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Autonomous Silo Fixer</text>
      <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">3 Production Actions</text>
      <rect x="18" y="98" width="80" height="14" rx="3" fill="#1E3A8A" />
      <text x="58" y="108" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" text-anchor="middle">BONUS 1: AGENTS</text>
    </g>

    <!-- Badge 3: Atlassian MCP Gateway -->
    <g transform="translate(436, 0)">
      <rect width="205" height="120" rx="12" fill="url(#cardGrad)" stroke="#0E7490" stroke-width="1.2" />
      <circle cx="34" cy="34" r="16" fill="#164E63" />
      <text x="27" y="40" font-size="16">🔌</text>
      <text x="58" y="38" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">Atlassian MCP</text>
      <text x="18" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Spec JSON-RPC 2.0</text>
      <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Cursor &amp; Claude Bridge</text>
      <rect x="18" y="98" width="70" height="14" rx="3" fill="#155E75" />
      <text x="53" y="108" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" text-anchor="middle">BONUS 2: MCP</text>
    </g>

    <!-- Badge 4: Teamwork Graph Integration -->
    <g transform="translate(654, 0)">
      <rect width="205" height="120" rx="12" fill="url(#cardGrad)" stroke="#047857" stroke-width="1.2" />
      <circle cx="34" cy="34" r="16" fill="#064E3B" />
      <text x="27" y="40" font-size="16">🌐</text>
      <text x="58" y="38" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">Teamwork Graph</text>
      <text x="18" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Multi-Hop Traversal</text>
      <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Jira + Confluence Policy</text>
      <rect x="18" y="98" width="70" height="14" rx="3" fill="#065F46" />
      <text x="53" y="108" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" text-anchor="middle">BONUS 3: GRAPH</text>
    </g>

    <!-- Badge 5: SHA-256 Release Ledger -->
    <g transform="translate(872, 0)">
      <rect width="205" height="120" rx="12" fill="url(#cardGrad)" stroke="#B45309" stroke-width="1.2" />
      <circle cx="34" cy="34" r="16" fill="#78350F" />
      <text x="27" y="40" font-size="16">🛡️</text>
      <text x="58" y="38" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">Crypto Ledger</text>
      <text x="18" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">SHA-256 Merkle Proof</text>
      <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Tamper-Evident KVS</text>
      <rect x="18" y="98" width="95" height="14" rx="3" fill="#854D0E" />
      <text x="65" y="108" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" text-anchor="middle">BONUS 4: MARKETPLACE</text>
    </g>

  </g>
</svg>
